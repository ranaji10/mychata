name: Keep lovable-sync current
# Lovable works from the branch lovable-sync (it can't push to main: the ruleset refuses it).
# This workflow keeps lovable-sync and main together, so neither side waits on the other:
#
# - lovable-sync behind main (the usual case after a merge): fast-forward it to main.
# - lovable-sync has Lovable commits that are not on main (e.g. a migration marker, T-066):
#   1. if main also moved, merge main into lovable-sync (a merge commit, never a rewrite), so
#      Lovable still gets every merge; on a conflict nothing is pushed and the run warns;
#   2. make sure a PR "lovable-sync -> main" is open (opened here if there is none), so the
#      maintainers only have to merge it;
#   3. run CI on lovable-sync: pushes and PRs made with this workflow's token start no other
#      workflows, so the PR would otherwise wait for its required "check" forever.
#
# Needs the repository setting Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests" (for step 2).
on:
  push:
    branches: [main, lovable-sync]
  workflow_dispatch:

permissions:
  contents: write # move or merge into lovable-sync, and nothing else
  pull-requests: write # open the lovable-sync -> main PR
  actions: write # start CI on lovable-sync

concurrency:
  group: sync-lovable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bring lovable-sync and main together
        run: bash scripts/sync-lovable.sh
