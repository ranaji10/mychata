name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: "Run smoke tests against this URL (e.g. staging)"
        required: false

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration guard compares this branch with main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      # Two people plus Lovable add migrations: catch duplicate numbers, journal gaps
      # and edits to already-applied migrations before anything else runs.
      - name: Migration numbering and history guard
        run: bun scripts/check-migrations.ts origin/main
      # Lovable writes package URLs from its private cache into bun.lock; CI can't reach it.
      # Same tarballs and integrity hashes are on the public registry.
      - name: Point lockfile at the public npm registry
        run: sed -i -E 's#https://[a-z0-9-]+-npm\.pkg\.dev/lovable-core-prod/[a-z-]+/#https://registry.npmjs.org/#g' bun.lock
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      # Lovable pushes to main without running Prettier. On 29 Sep that turned main and every
      # open PR red twice (fixed by hand in PR #14). So a PR answers only for the files it
      # changes, and on main the full check warns instead of failing. `bun run check` on your
      # own computer and a manual run of this workflow still check everything strictly.
      - name: Formatting of the files this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          # NUL-separated, so names with spaces or a "$" (src/routes/verejne.zadost.$token.tsx)
          # reach Prettier untouched. Deleted files are left out (ACMR). Prettier skips what it
          # can't format (--ignore-unknown) and what .prettierignore lists.
          git diff -z --name-only --diff-filter=ACMR origin/main...HEAD > "$RUNNER_TEMP/changed-files"
          if [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo "This pull request changes no files that exist; nothing to check."
            exit 0
          fi
          xargs -0 bunx prettier --check --ignore-unknown < "$RUNNER_TEMP/changed-files"
      - name: Formatting of everything (warning only, push to main)
        if: github.event_name == 'push'
        run: |
          # --list-different exits 0 when all is formatted, 1 when files need formatting and
          # 2 when Prettier itself failed. Only the last one fails the job.
          status=0
          files=$(bunx prettier --list-different .) || status=$?
          if [ "$status" -ge 2 ]; then
            echo "$files"
            echo "Prettier failed (exit $status); this is not a formatting warning."
            exit "$status"
          fi
          if [ -n "$files" ]; then
            echo "$files"
            # %0A is a line break inside a GitHub annotation.
            echo "::warning title=Unformatted files on main::Run 'bun run format' in a pull request. Files:%0A${files//$'\n'/%0A}"
          else
            echo "All files are formatted."
          fi
      - name: Formatting of everything (strict, manual run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run format:check
      - name: Unit, database security and policy-lint tests
        run: bun run test
      - name: Generated docs are up to date
        run: bun run docs:check
      - run: bun run build
      # Guard for incident B-002: a build without the public Supabase settings compiles fine
      # but the app crashes in every browser. Fail CI instead of shipping that.
      - name: Browser bundle contains the Supabase settings
        run: grep -rlqE "VITE_SUPABASE_URL:.https://[a-z0-9]+\.supabase\.co" .output/public/assets || (echo "Client bundle has no Supabase URL. Is .env.production present?" && exit 1)

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_base_url != ''
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sed -i -E 's#https://[a-z0-9-]+-npm\.pkg\.dev/lovable-core-prod/[a-z-]+/#https://registry.npmjs.org/#g' bun.lock
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
        env:
          E2E_BASE_URL: ${{ inputs.e2e_base_url }}
